
{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طباعة ملصقات QR</title>
    <style>
        @page {
            size: 60mm 40mm;
            margin: 0;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 60mm;
            background: #fff;
            font-family: sans-serif;
        }

        .label {
            width: 60mm;
            height: 40mm;
            margin: 0;
            padding: 1mm;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            break-inside: avoid;
            page-break-inside: avoid;
            page-break-after: always;
            break-after: page;
        }

        .label:last-child {
            page-break-after: auto;
            break-after: auto;
        }

        .qr-only {
            display: block;
            width: 36mm;
            height: 36mm;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .no-print {
            padding: 10px;
            display: flex;
            gap: 8px;
        }

        .no-print button,
        .no-print a {
            padding: 8px 12px;
            text-decoration: none;
            border: 1px solid #1B4D3E;
            background: #1B4D3E;
            color: white;
            cursor: pointer;
        }

        @media print {
            html,
            body {
                width: 60mm;
                margin: 0 !important;
                padding: 0 !important;
            }

            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="no-print">
        <button type="button" onclick="window.print()">
            طباعة الملصقات
        </button>
        <a href="{% url 'truck_detail' truck.pk %}">
            رجوع
        </a>
    </div>

    {% for item in pallets_with_qr %}
    <div class="label">
        <img
            class="qr-only"
            src="{{ item.qr_image_b64 }}"
            data-qr-url="{{ item.qr_url }}"
            alt="QR {{ item.pallet.pallet_code }}"
        >
    </div>
    {% endfor %}
</body>
</html>
