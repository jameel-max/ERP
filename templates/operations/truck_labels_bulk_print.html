{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طباعة ملصقات السيارة {{ truck.lot_number }} | {{ company_name_en }}</title>
    <link rel="stylesheet" href="{% static 'vendor/cairo/cairo.css' %}">
    <style>
        @page {
            size: 100mm 150mm;
            margin: 0;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: #fff;
            font-family: 'Cairo', sans-serif;
        }
        .page-break {
            page-break-after: always;
            box-sizing: border-box;
            width: 100mm;
            height: 150mm;
            display: flex;
            flex-direction: column;
            gap: 3mm;
            align-items: center;
            justify-content: center;
        }
        .page-break:last-child {
            page-break-after: auto;
        }
        .brand-mark {
            width: 18mm;
            height: 18mm;
            object-fit: cover;
            border-radius: 50%;
        }
        .qr-code {
            display: block;
            width: 86mm;
            height: 86mm;
            image-rendering: pixelated;
        }
        .no-print {
            position: fixed;
            top: 6px;
            left: 6px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }
        .no-print button,
        .no-print a {
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #1B4D3E;
            background: #1B4D3E;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
        }
        @media print {
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="no-print">
        <button type="button" onclick="window.print()">طباعة كل الملصقات</button>
        <a href="{% url 'truck_detail' truck.pk %}">رجوع لتفاصيل السيارة</a>
    </div>

    <!-- كل صفحة = شعار الشركة ورمز QR كبير لسهولة التعرف والمسح -->
    {% for item in pallets_with_qr %}
    <div class="page-break">
        <img class="brand-mark" src="{% static 'images/royal-fruit-logo.jpg' %}" alt="{{ company_name_en }}">
        <img class="qr-code" src="{{ item.qr_image_b64 }}" data-qr-url="{{ item.qr_url }}"
             alt="QR {{ item.pallet.pallet_code }}">
    </div>
    {% endfor %}
</body>
</html>
