{% extends "base.html" %}

{% block title %}تسجيل الدخول | {{ company_name_en }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-lg border-0 mt-4">
                <div class="card-header text-center py-4" style="background-color: var(--rf-primary); color: white; border-top-left-radius: 10px; border-top-right-radius: 10px;">
                    <i class="bi bi-shield-lock-fill fs-1 text-warning d-block mb-2"></i>
                    <h3 class="fw-bold mb-1">{{ company_name_en }}</h3>
                    <p class="mb-0 text-light opacity-75">نظام إدارة المشغل والتجار والبرادات</p>
                </div>
                <div class="card-body p-4 bg-white">
                    <form method="post" data-ajax="0">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="bi bi-person me-1"></i> اسم المستخدم</label>
                            {{ form.username }}
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold"><i class="bi bi-key me-1"></i> كلمة المرور</label>
                            {{ form.password }}
                        </div>
                        <button type="submit" class="btn btn-royal w-100 py-2 fs-5">
                            <i class="bi bi-box-arrow-in-left me-1"></i> دخول للنظام
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
